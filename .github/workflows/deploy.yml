name: Deploy to VPS (wed-secrets.ru)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # КЭШ ПЕРЕЖАТЫХ КАРТИНОК. Без него Build шёл 7 минут из 8 минут
      # деплоя: раннер каждый раз чистый, и Sharp режет все ~4700 вариантов
      # srcset с нуля (локально та же сборка — 15 секунд, потому что кэш
      # лежит в node_modules/.astro). Ключ — по содержимому src/assets:
      # новые фото досчитываются поверх ближайшего кэша (restore-keys),
      # а не всё заново.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-

      # Страж стилей кабинета (05.11.2026): цвет литералом, токен или класс
      # витрины, капс в кабинете/админке — выкладка не идёт. Правила —
      # .claude/skills/cabinet-ui, исключение превью — метка site-preview.
      - name: Cabinet style guard
        run: node scripts/check-cabinet-style.mjs

      # Шага «Cabinet cards from base» (pb-pull-cabinet) больше нет (05.11.2026):
      # карточки подрядчиков и площадок рисует служба wedsecrets-ssr прямо из
      # базы (src/lib/live-data.ts), в статике их страниц нет — выгружать их
      # в сборку незачем, а сбой базы останавливал всю выкладку кода.
      # Скрипт остался для scripts/e2e-cabinet.mjs.

      - name: Build
        env:
          SITE_URL: https://wed-secrets.ru
          # SITE_BASE не задаём: на своём домене сайт живёт в корне.
          # Индексация открыта 20.10.2026 (docs/seo/SEO.md, раздел 5): снимает
          # мета-тег noindex и Disallow в robots.txt. Страница, которой
          # в поиске не место, ставит свой <meta name="robots" content="noindex">.
          SITE_INDEXABLE: 'true'
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
          # номер бота (цифры до «:» в токене) — не секрет: без него кнопка
          # «Войти через Telegram» остаётся ссылкой прототипа
          PUBLIC_TG_BOT_ID: ${{ vars.TG_BOT_ID }}
          # никнейм бота MAX — тоже не секрет (ключ живёт только в базе);
          # без него «Войти через MAX» остаётся ссылкой прототипа
          PUBLIC_MAX_BOT: id503613656680_bot
          # СЕРВИС ФОТО (07.11.2026, docs/PHOTO-SERVICE.md): Astro фото не режет —
          # ни при сборке, ни на сервере; адреса /ph/… режет imgproxy на VPS.
          # Без этой переменной сборка снова пойдёт через sharp (5–7 минут,
          # ~2 ГБ вариантов) и страницы — через /_image службы страниц.
          PHOTO_SERVICE: '1'
        run: npx astro build

      # Карта сайта из готовой сборки (страницы с noindex в неё не идут).
      - name: Sitemap
        run: node scripts/sitemap.mjs dist/client https://wed-secrets.ru

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # ПРОВЕРКА СВЯЗИ ДО ЗАЛИВКИ (12.10.2026). Rsync без таймаутов, когда
      # сервер не отвечал по SSH, висел часами и молча — три деплоя подряд
      # стояли на «Rsync» без единой строки в логе. Теперь сначала стучимся
      # в порт 22 и делаем пустой ssh-вход с подробным выводом: деплой
      # падает за минуту и в логе видно, на чём именно (порт закрыт,
      # рукопожатие не идёт, ключ не принят).
      - name: Check SSH to server
        timeout-minutes: 2
        run: |
          host="${{ secrets.DEPLOY_HOST }}"
          echo "== порт 22"
          if timeout 15 bash -c "</dev/tcp/$host/22"; then echo "порт 22 открыт"; else echo "порт 22 не отвечает за 15 с"; fi
          echo "== ssh-вход"
          ssh -v -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "${{ secrets.DEPLOY_USER }}@$host" 'echo ssh ok; df -h / | tail -1; uptime' 2>&1 | tail -40

      - name: Rsync dist to server
        # --delete: удалённые страницы исчезают и на сервере,
        # иначе каталог копит мусор от прошлых сборок.
        # до трёх попыток по 8 минут (03.11): 02.11 канал раннер → VPS завис,
        # шаг оборвался по таймауту, и одобренная карточка сутки не выходила.
        # rsync докачивает только недостающее — повтор продолжает, а не
        # начинает заново.
        timeout-minutes: 26
        run: |
          # registry/ — отчёт утренней сверки (registry-nightly.yml): его кладут
          # на сервер отдельно, и --delete стирал бы его каждым деплоем
          # --checksum: раннер каждый раз свежий, у всех 11 тыс. файлов новое
          # время изменения, и без него rsync гонял блочные контрольные суммы
          # по всем 2 ГБ. 12.10.2026 на медленном канале до VPS (~37 КБ/с)
          # это растянуло заливку с 18 секунд до 7 минут (а до таймаутов —
          # до бесконечного «висит»). С -c сравнение по содержимому идёт
          # на самом сервере, по сети — только изменившиеся файлы.
          for attempt in 1 2 3; do
            echo "::group::попытка $attempt"
            if timeout 8m rsync -az --checksum --delete --timeout=60 --stats --exclude '.write-test' --exclude 'registry/' \
              -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3" \
              dist/client/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "попытка $attempt не прошла"; sleep 20
          done
          exit 1

      # СЕРВЕР СТРАНИЦ ИЗ БАЗЫ (03.11, с 05.11 — весь каталог). Статика —
      # dist/client (шаг выше); главную, /moskva/podryadchiki/**, /moskva/ploshchadki/**,
      # карту каталога, превью анкеты и /_image рисует служба wedsecrets-ssr
      # (node dist/server/entry.mjs на 127.0.0.1:4321), docs/DEPLOY.md.
      # Зависимости ставятся на сервере, только когда поменялся package-lock.
      # Падение здесь ЛОМАЕТ каталог: новая статика уже залита, а служба на
      # старом коде — перезапустить шаг (Re-run).
      - name: Preview server
        timeout-minutes: 15
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          mkdir -p ssr && cp -r dist/server ssr/server && cp package.json package-lock.json ssr/
          rsync -az --checksum --delete --timeout=60 --exclude 'node_modules/' --exclude '.installed-lock' --exclude 'client/' \
            -e "$SSH" ssr/ "$TARGET:/srv/wedsecrets-ssr/"
          # client → папка сайта (05.11.2026): там лежат оригиналы фото проекта
          # (/_astro/*), и /_image сервера режет их на лету — без этого фото
          # из src/assets на страницах, которые рисует сервер, отвечали 500.
          $SSH "$TARGET" 'set -e; cd /srv/wedsecrets-ssr
            [ -L client ] || { rm -rf client; ln -s /var/www/wedsecrets client; }
            if ! cmp -s package-lock.json .installed-lock; then
              npm ci --omit=dev --no-audit --no-fund && cp package-lock.json .installed-lock
            fi
            sudo /usr/bin/systemctl restart wedsecrets-ssr; sleep 3
            curl -s -o /dev/null -w "превью отвечает: %{http_code}\n" http://127.0.0.1:4321/profi/prevyu/'

      # ОБРАБОТЧИК НАРЕЗКИ ФОТО (сервис фото, 07.11.2026, docs/PHOTO-SERVICE.md).
      # Прогрева /_image больше нет: новые кадры сборки дорежет сам обработчик
      # (обход раз в 10 минут), посетитель до этого получает кадр, нарезанный
      # imgproxy на лету. Здесь только код обработчика — и перезапуск, если он
      # поменялся. Шаг не роняет выкладку: сайт от обработчика не зависит.
      - name: Photo worker
        continue-on-error: true
        timeout-minutes: 3
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          mkdir -p photo/scripts photo/src/lib
          cp scripts/photo-worker.mjs photo/scripts/ && cp src/lib/photo-url.mjs photo/src/lib/
          echo '{"type":"module"}' > photo/package.json
          changed=$(rsync -az --checksum --timeout=60 --itemize-changes -e "$SSH" photo/ "$TARGET:/srv/wedsecrets-photos/app/" | grep -c '^<f' || true)
          if [ "$changed" != "0" ]; then $SSH "$TARGET" 'sudo /usr/bin/systemctl restart wedsecrets-photo'; echo "обработчик обновлён"; else echo "обработчик без изменений"; fi

      # Проверять по IP бессмысленно: nginx разбирает запросы по server_name,
      # и на голый адрес отвечает дефолтный сервер, а не наш сайт. Стучимся
      # доменом и идём за редиректом на https, иначе ловим 301 вместо 200.
      - name: Smoke check
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' https://wed-secrets.ru/)
          echo "Главная отдала $code"
          test "$code" = "200"
          # 05.11.2026: страницы с сервера отдавали noindex — флаг индексации
          # не доходил до службы, а проверка смотрела только код ответа. Теперь
          # смотрим содержимое: нет noindex, есть заголовок и плитки.
          # кэш nginx живёт 10 с и отдаёт устаревшую копию, пока обновляет её
          # в фоне — первый проход только будит обновление, проверяем вторым
          pages="/ /moskva/podryadchiki/ /moskva/ploshchadki/ /moskva/podryadchiki/fotografy/"
          for p in $pages; do curl -s -o /dev/null "https://wed-secrets.ru$p"; done
          sleep 15
          bad=0
          for p in $pages; do
            html=$(curl -sL "https://wed-secrets.ru$p")
            imgs=$(printf '%s' "$html" | grep -o '<img' | wc -l)
            if printf '%s' "$html" | grep -q 'name="robots" content="noindex'; then echo "noindex на $p"; bad=1; fi
            if ! printf '%s' "$html" | grep -q '<h1'; then echo "нет h1 на $p"; bad=1; fi
            if ! printf '%s' "$html" | grep -q '</body>'; then echo "страница оборвана: $p"; bad=1; fi
            echo "$p: картинок $imgs"
            [ "$imgs" -ge 5 ] || { echo "мало плиток на $p"; bad=1; }
          done
          test "$bad" = "0"

      # РОЛИКИ НЕ В GIT (docs/VIDEO.md): они живут на сервере отдельно и заливаются
      # scripts/media-push.sh руками. 28.09 код с роликами Балашовой и
      # Косаревой ушёл без заливки — неделю страницы ссылались на файлы,
      # которых на сервере не было, и видео «не работало». Теперь каждый
      # ролик, на который ссылается собранный сайт, должен отдаваться
      # сервером, иначе деплой красный.
      - name: Reels on server
        run: |
          missing=0
          for u in $(grep -rhoE '/[A-Za-z0-9/_.-]+\.mp4' dist/client --include=*.html | sort -u); do
            code=$(curl -s -o /dev/null -r 0-1 -w '%{http_code}' "https://wed-secrets.ru$u")
            if [ "$code" != "206" ] && [ "$code" != "200" ]; then echo "нет на сервере ($code): $u"; missing=1; fi
          done
          test "$missing" = "0" || { echo "Залить: bash scripts/media-push.sh"; exit 1; }

      # Упавшая выкладка раньше проходила молча: 02.11 одобренная карточка
      # сутки не выходила на сайт, и никто не знал. Теперь — сообщение в группу
      # модерации (тот же бот и чат, что у базы; секреты TG_BOT_TOKEN, TG_CHAT_ID).
      - name: Notify moderation chat on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || { echo "нет TG_BOT_TOKEN / TG_CHAT_ID в секретах"; exit 0; }
          # карточки из базы на сайт идут без выкладки (05.11.2026) — упала только выкладка кода
          text="Выкладка кода сайта не прошла — нужно перезапустить: Actions → Deploy → Re-run. Карточки из базы это не задерживает. $RUN_URL"
          curl -s -o /dev/null -w "telegram %{http_code}\n" -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT_ID" --data-urlencode text="$text" -d disable_web_page_preview=true
