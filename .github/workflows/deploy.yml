name: Deploy to VPS (wed-secrets.ru)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # КЭШ ПЕРЕЖАТЫХ КАРТИНОК. Без него Build шёл 7 минут из 8 минут
      # деплоя: раннер каждый раз чистый, и Sharp режет все ~4700 вариантов
      # srcset с нуля (локально та же сборка — 15 секунд, потому что кэш
      # лежит в node_modules/.astro). Ключ — по содержимому src/assets:
      # новые фото досчитываются поверх ближайшего кэша (restore-keys),
      # а не всё заново.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-

      - name: Build
        env:
          SITE_URL: https://wed-secrets.ru
          # SITE_BASE не задаём: на своём домене сайт живёт в корне.
          # SITE_INDEXABLE тоже не задаём — дизайн-фаза, сайт закрыт
          # от поисковиков (см. SEO.md, раздел 5). Перед запуском: true.
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: npx astro build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Rsync dist to server
        # --delete: удалённые страницы исчезают и на сервере,
        # иначе каталог копит мусор от прошлых сборок.
        run: |
          # registry/ — отчёт утренней сверки (registry-nightly.yml): его кладут
          # на сервер отдельно, и --delete стирал бы его каждым деплоем
          rsync -az --delete --exclude '.write-test' --exclude 'registry/' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # Проверять по IP бессмысленно: nginx разбирает запросы по server_name,
      # и на голый адрес отвечает дефолтный сервер, а не наш сайт. Стучимся
      # доменом и идём за редиректом на https, иначе ловим 301 вместо 200.
      - name: Smoke check
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' https://wed-secrets.ru/)
          echo "Главная отдала $code"
          test "$code" = "200"

      # РОЛИКИ НЕ В GIT (VIDEO.md): они живут на сервере отдельно и заливаются
      # scripts/media-push.sh руками. 28.09 код с роликами Балашовой и
      # Косаревой ушёл без заливки — неделю страницы ссылались на файлы,
      # которых на сервере не было, и видео «не работало». Теперь каждый
      # ролик, на который ссылается собранный сайт, должен отдаваться
      # сервером, иначе деплой красный.
      - name: Reels on server
        run: |
          missing=0
          for u in $(grep -rhoE '/[A-Za-z0-9/_.-]+\.mp4' dist --include=*.html | sort -u); do
            code=$(curl -s -o /dev/null -r 0-1 -w '%{http_code}' "https://wed-secrets.ru$u")
            if [ "$code" != "206" ] && [ "$code" != "200" ]; then echo "нет на сервере ($code): $u"; missing=1; fi
          done
          test "$missing" = "0" || { echo "Залить: bash scripts/media-push.sh"; exit 1; }
