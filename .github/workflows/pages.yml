name: Deploy preview to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        env:
          SITE_URL: https://nikitaa2333333.github.io
          SITE_BASE: /wedwibse/
        run: npx astro build
      # Astro сам расставляет base только своим ассетам. Рукописные корневые
      # пути он не трогает: ссылки в разметке, href в JSON для избранного
      # и url() в CSS-масках логотипов. Их дописываем здесь, на готовом dist,
      # чтобы исходники работали от корня и в дев-режиме, и на боевом домене.
      - name: Prefix hand-written absolute links with base
        run: |
          find dist \( -name '*.html' -o -name '*.css' \) -print0 | xargs -0 perl -pi \
            -e 's{(href|src)="/(?!wedwibse/)}{$1="/wedwibse/}g;' \
            -e 's{"/(moskva|izbrannoe)/}{"/wedwibse/$1/}g;' \
            -e 's{url\((["\x27]?)/(?!wedwibse/)}{url($1/wedwibse/}g;'
      - name: SPA-style fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
