# /etc/nginx/snippets/wed-photo-site.conf — публичные адреса сервиса фото
# (07.11.2026). Подключается в server{} сайта: include snippets/wed-photo-site.conf;
# ВАЖНО: include ставить ВЫШЕ regex-location статики (`~* \.(…webp|jpg…)$`) —
# из regex-location nginx берёт первый подошедший по порядку в файле.
#
# Вариант лежит файлом — отдаём сразу. Нет файла — режет imgproxy и nginx
# сохраняет результат (proxy_store): второй раз этот вариант не режется.
# Обычно до посетителя всё нарезано заранее обработчиком (по «Готово»
# и обходом), резка «на лету» — страховка.

# кадр сборки (/_astro)
location ~ "^/ph/(?<phw>220|320|360|440|480|560|640|720|800|900|1100|1200|1400|1800|2400)/a/(?<phfile>[A-Za-z0-9._-]+\.(?:webp|jpe?g|png|avif))$" {
    set $ph_w $phw; set $ph_src "site/$phfile"; set $ph_key "$phw/a/$phfile";
    root /srv/wedsecrets-photos/store;
    types { } default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files /$ph_key @ph_cut_pub;
}

# файл базы — ТОЛЬКО опубликованные коллекции: specialists, venues
location ~ "^/ph/(?<phw>220|320|360|440|480|560|640|720|800|900|1100|1200|1400|1800|2400)/f/(?<phcoll>pbc_1374551344|pbc_1379753955)/(?<phrec>[a-z0-9]{15})/(?<phname>[A-Za-z0-9._-]+)$" {
    set $ph_w $phw; set $ph_src "pb/$phcoll/$phrec/$phname"; set $ph_key "$phw/f/$phname";
    root /srv/wedsecrets-photos/store;
    types { } default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files /$ph_key @ph_cut_pub;
}

location @ph_cut_pub {
    proxy_pass http://wedimgproxy/_/w$ph_w/plain/local:///$ph_src;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_store /srv/wedsecrets-photos/store/$ph_key;
    proxy_store_access user:rw group:rw all:r;
    proxy_temp_path /srv/wedsecrets-photos/tmp;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# превью анкеты до «Готово»: режется на лету по 15-минутной ссылке, файлом не хранится
location ~ "^/ph/(?<phw>220|320|360|440|480|560|640|720|800|900|1100|1200|1400|1800|2400)/p$" {
    proxy_pass http://wedimgproxy/_/w$phw/plain/http://127.0.0.1:8090/api/wed/preview-file%3F$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_cache wedphp;
    proxy_cache_key $uri$is_args$args;
    proxy_cache_valid 200 1h;
    proxy_ignore_headers Cache-Control Expires;
    add_header Cache-Control "private, max-age=900";
}

# остальное под /ph/ — не наш адрес. Без ^~: иначе этот префикс перебил бы
# регулярки выше, и любой /ph/ отвечал бы 404
location /ph/ { return 404; }
