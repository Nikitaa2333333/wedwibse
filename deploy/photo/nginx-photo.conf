# /etc/nginx/conf.d/wed-photo.conf — сервис фото, уровень http (07.11.2026).
# Публичные адреса /ph/… — в snippets/wed-photo-site.conf (подключается
# в server{} сайта). Здесь: imgproxy, кэш превью и ВНУТРЕННИЙ адрес нарезки
# для обработчика (scripts/photo-worker.mjs) — он один умеет резать кадры
# ревизий (закрытые файлы черновиков наружу не открываем).

upstream wedimgproxy {
    server 127.0.0.1:8081;
    keepalive 4;
}

# кадры превью анкеты: черновик меняется, ссылка живёт 15 минут — только кэш
proxy_cache_path /var/cache/nginx/wed-ph-preview levels=1:2 keys_zone=wedphp:5m max_size=300m inactive=1d use_temp_path=off;

server {
    listen 127.0.0.1:8088;
    server_name _;
    access_log /var/log/nginx/wed-photo-cut.log;

    # кадр сборки
    location ~ "^/ph/(?<phw>220|320|360|440|480|560|640|720|800|900|1100|1200|1400|1800|2400)/a/(?<phfile>[A-Za-z0-9._-]+\.(?:webp|jpe?g|png|avif))$" {
        set $ph_w $phw; set $ph_src "site/$phfile"; set $ph_key "$phw/a/$phfile";
        root /srv/wedsecrets-photos/store;
        try_files /$ph_key @ph_cut;
    }
    # файл базы — любой коллекции, включая ревизии (адрес слушает только 127.0.0.1)
    location ~ "^/ph/(?<phw>220|320|360|440|480|560|640|720|800|900|1100|1200|1400|1800|2400)/f/(?<phcoll>pbc_[0-9]+)/(?<phrec>[a-z0-9]{15})/(?<phname>[A-Za-z0-9._-]+)$" {
        set $ph_w $phw; set $ph_src "pb/$phcoll/$phrec/$phname"; set $ph_key "$phw/f/$phname";
        root /srv/wedsecrets-photos/store;
        try_files /$ph_key @ph_cut;
    }
    location @ph_cut {
        proxy_pass http://wedimgproxy/_/w$ph_w/plain/local:///$ph_src;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        # нарезанное — файлом навсегда; nginx пишет только ответ 200
        proxy_store /srv/wedsecrets-photos/store/$ph_key;
        proxy_store_access user:rw group:rw all:r;
        proxy_temp_path /srv/wedsecrets-photos/tmp;
    }
    location / { return 404; }
}
