<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Карта WED Secrets</title>
<style>
  /* Внутренний инструмент: тёмный холст карты, цвет несёт смысл. */
  :root {
    --bg: #0e1117; --bg2: #161b24; --card: #1d2430; --line: #2a3342; --ink: #fff;
    --done: #3ccf73; --work: #4ea1ff; --todo: #8b95a7; --bad: #ff5a5a; --block: #f2a93b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.4 Onest, system-ui, -apple-system, "Segoe UI", sans-serif; }

  .top { position: fixed; z-index: 5; top: 12px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  h1 { margin: 0; font-size: 18px; }
  .upd { font-size: 12px; }
  .tabs { display: flex; gap: 2px; background: var(--bg2); padding: 3px; border-radius: 999px; }
  .tabs button, .tool { font: inherit; border: 0; color: var(--ink); background: transparent;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .tool { background: var(--bg2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; background: var(--bg2);
    padding: 6px 12px; border-radius: 999px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  svg.map { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  svg.map.drag { cursor: grabbing; }
  svg text { fill: var(--ink); font-family: inherit; user-select: none; }

  /* ── метро */
  .seg-done { stroke-width: 9; stroke-linecap: round; fill: none; }
  .seg-todo { stroke-width: 4; stroke-linecap: round; fill: none; stroke-dasharray: 2 9; opacity: .75; }
  .st { cursor: pointer; }
  .st:hover circle.ring { stroke-width: 5; }
  .st .lbl { font-size: 12.5px; }
  .pulse { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(2.4); opacity: 0 } }
  .ttl { font-size: 15px; font-weight: 700; }
  .cnt { font-size: 12px; }

  /* ── система */
  .zone rect { fill: var(--bg2); }
  .zone.future rect { fill: transparent; stroke: var(--line); stroke-width: 2; stroke-dasharray: 8 8; }
  .zone text { font-size: 13px; font-weight: 700; }
  .edge path { fill: none; stroke-width: 2.2; transition: opacity .2s; }
  .edge.done path { stroke: #5d6b82; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
  .edge.bad path  { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
  .edge.todo path, .edge.block path { stroke: var(--todo); stroke-dasharray: 3 7; opacity: .6; }
  .edge text { font-size: 11px; }
  .edge .lb { fill: var(--bg); }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .node { cursor: pointer; transition: opacity .2s; }
  .node rect.box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  .node:hover rect.box, .node.sel rect.box { stroke: var(--ink); }
  .node.future rect.box { fill: var(--bg); stroke-dasharray: 5 5; }
  .node .nt { font-size: 14px; font-weight: 700; }
  .node .ns { font-size: 11px; }
  svg.focus .node:not(.on), svg.focus .edge:not(.on) { opacity: .15; }

  /* ── панель деталей */
  .panel { position: fixed; z-index: 6; right: 12px; top: 64px; width: 340px; max-height: calc(100% - 80px);
    overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .panel h2 { margin: 0 32px 6px 0; font-size: 18px; }
  .panel .x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: 0;
    border-radius: 50%; background: var(--card); color: var(--ink); font-size: 18px; cursor: pointer; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; color: #0e1117; }
  .panel code { font-size: 12px; background: var(--card); padding: 2px 6px; border-radius: 5px; }
  .panel ol { padding-left: 0; list-style: none; margin: 8px 0 0; }
  .panel li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .panel li i { flex: 0 0 9px; height: 9px; border-radius: 50%; }
  .panel h3 { font-size: 14px; margin: 14px 0 0; }
  .blk { position: fixed; z-index: 5; left: 12px; bottom: 12px; max-width: 420px; background: var(--bg2);
    border-left: 3px solid var(--block); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; }
  .blk b { display: block; margin-bottom: 4px; }
  .blk ul { margin: 0; padding-left: 16px; }
  .hint { position: fixed; z-index: 5; right: 12px; bottom: 12px; font-size: 12px; background: var(--bg2);
    padding: 6px 12px; border-radius: 999px; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    .panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 55%; }
    .blk, .hint { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>Карта WED Secrets</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="metro">Путь</button>
    <button role="tab" data-tab="system">Система</button>
  </div>
  <button class="tool" id="fit">Вписать</button>
  <div class="legend" id="legend"></div>
  <span class="upd" id="upd"></span>
</div>

<svg class="map" id="metro" xmlns="http://www.w3.org/2000/svg"></svg>
<svg class="map" id="system" xmlns="http://www.w3.org/2000/svg" hidden></svg>

<aside class="panel" id="panel" hidden><button class="x" id="px" aria-label="Закрыть">×</button><div id="pbody"></div></aside>
<div class="blk" id="blk"></div>
<div class="hint">тянуть — двигать · колесо — масштаб · нажать — подробности</div>

<script src="data.js"></script>
<script>
const M = window.MAP;
const NS = 'http://www.w3.org/2000/svg';
const ST = { done: 'сделано', work: 'в работе', todo: 'впереди', bad: 'сломано', block: 'ждёт внешнего' };
const CV = s => `var(--${s})`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function wrap(text, max) {           // перенос подписи по словам
  const out = []; let cur = '';
  for (const w of text.split(' ')) {
    if ((cur + ' ' + w).trim().length > max && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  }
  if (cur) out.push(cur);
  return out;
}
function textLines(parent, lines, x, y, attrs = {}) {
  const t = el('text', { x, y, ...attrs }, parent);
  lines.forEach((ln, i) => { const s = el('tspan', { x, dy: i ? '1.2em' : 0 }, t); s.textContent = ln; });
  return t;
}

document.getElementById('upd').textContent = 'обновлено ' + M.updated;
document.getElementById('legend').innerHTML = Object.entries(ST)
  .map(([k, v]) => `<span><i style="background:${CV(k)}"></i>${v}</span>`).join('');
document.getElementById('blk').innerHTML = `<b>Ждём снаружи</b><ul>${M.blockers.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;

/* ═════════ ПУТЬ: схема метро ═════════ */
const metro = document.getElementById('metro');
const MW = 1720, ROW = 108, TOP = 120;
const MH = TOP + ROW * M.tracks.length + 40;
const X0 = 260, X1 = 1330, FX = 1560, FY = TOP + ROW * (M.tracks.length - 1) / 2;
const gLines = el('g', {}, metro), gSt = el('g', {}, metro);

M.tracks.forEach((tr, i) => {
  const y = TOP + i * ROW, n = tr.steps.length;
  const xs = tr.steps.map((_, k) => X0 + k * (X1 - X0) / (n - 1));
  // последний пройденный — до него сплошная жирная линия
  let reached = -1;
  tr.steps.forEach(([, s], k) => { if (s === 'done' || s === 'work') reached = k; });
  if (reached > 0) el('path', { d: `M${xs[0]},${y} H${xs[reached]}`, class: 'seg-done', stroke: tr.color }, gLines);
  const from = Math.max(reached, 0);
  el('path', { d: `M${xs[from]},${y} H${xs[n - 1]} C${xs[n - 1] + 110},${y} ${FX - 140},${FY} ${FX - 40},${FY}`,
    class: 'seg-todo', stroke: tr.color }, gLines);

  // название линии
  const done = tr.steps.filter(s => s[1] === 'done').length;
  el('rect', { x: 20, y: y - 22, width: 200, height: 44, rx: 22, fill: tr.color }, gSt);
  const tt = el('text', { x: 40, y: y - 2, class: 'ttl' }, gSt); tt.textContent = tr.title;
  const tc = el('text', { x: 40, y: y + 14, class: 'cnt' }, gSt); tc.textContent = `${done} из ${n}`;

  tr.steps.forEach(([name, s, note], k) => {
    const x = xs[k];
    const g = el('g', { class: 'st', tabindex: 0 }, gSt);
    if (s === 'work') el('circle', { cx: x, cy: y, r: 12, fill: tr.color, class: 'pulse' }, g);
    const fill = s === 'done' ? tr.color : s === 'bad' ? CV('bad') : s === 'block' ? CV('block') : '#0e1117';
    const ring = s === 'bad' ? CV('bad') : s === 'block' ? CV('block') : tr.color;
    el('circle', { cx: x, cy: y, r: s === 'work' ? 12 : 10, fill: s === 'work' ? '#fff' : fill, stroke: ring, 'stroke-width': 4, class: 'ring' }, g);
    const mark = s === 'done' ? '✓' : s === 'bad' ? '!' : s === 'block' ? '…' : '';
    if (mark) { const m = el('text', { x, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700 }, g); m.textContent = mark; }
    textLines(g, wrap(name, 17), x, y + 30, { 'text-anchor': 'middle', class: 'lbl' });
    g.addEventListener('click', e => { e.stopPropagation(); showStep(tr, name, s, note); });
  });
});
// пересадка «Открытие»
el('circle', { cx: FX, cy: FY, r: 44, fill: '#fff' }, gSt);
el('circle', { cx: FX, cy: FY, r: 36, fill: '#0e1117' }, gSt);
const fin = el('text', { x: FX, y: FY + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700 }, gSt);
fin.textContent = M.finale.title;
textLines(gSt, wrap(M.finale.note, 26), FX, FY + 68, { 'text-anchor': 'middle', 'font-size': 12 });

/* ═════════ СИСТЕМА: граф связей ═════════ */
const sys = document.getElementById('system');
const SW = 1600, SH = 1000, NW = 176, NH = 54;
const byId = Object.fromEntries(M.nodes.map(n => [n.id, n]));
const zoneOf = n => M.zones.find(z => n.x >= z.x && n.x <= z.x + z.w);

M.zones.forEach(z => {
  const g = el('g', { class: 'zone' + (z.future ? ' future' : '') }, sys);
  el('rect', { x: z.x, y: 70, width: z.w, height: SH - 90, rx: 22 }, g);
  const t = el('text', { x: z.x + 20, y: 100 }, g); t.textContent = z.title;
});
const gE = el('g', {}, sys), gN = el('g', {}, sys);
const edges = M.links.map(([a, b, label, s]) => {
  const A = byId[a], B = byId[b];
  let d, mx, my;
  if (Math.abs(A.x - B.x) < 40) {            // в одной колонке — дуга сбоку
    const y1 = A.y + (B.y > A.y ? NH / 2 : -NH / 2), y2 = B.y + (B.y > A.y ? -NH / 2 : NH / 2);
    d = `M${A.x},${y1} C${A.x + 60},${(y1 + y2) / 2} ${B.x + 60},${(y1 + y2) / 2} ${B.x},${y2}`;
    mx = A.x + 46; my = (y1 + y2) / 2;
  } else {
    const dir = B.x > A.x ? 1 : -1;
    const x1 = A.x + dir * NW / 2, x2 = B.x - dir * NW / 2, c = Math.max(60, Math.abs(x2 - x1) / 2);
    d = `M${x1},${A.y} C${x1 + dir * c},${A.y} ${x2 - dir * c},${B.y} ${x2},${B.y}`;
    mx = (x1 + x2) / 2; my = (A.y + B.y) / 2;
  }
  const g = el('g', { class: 'edge ' + s }, gE);
  el('path', { d, 'marker-end': 'url(#arr-' + s + ')' }, g);
  if (label) {
    const w = label.length * 6.4 + 12;
    el('rect', { x: mx - w / 2, y: my - 10, width: w, height: 18, rx: 9, class: 'lb' }, g);
    const t = el('text', { x: mx, y: my + 3.5, 'text-anchor': 'middle' }, g); t.textContent = label;
  }
  return { a, b, g };
});
// наконечники стрелок по цвету статуса
const defs = el('defs', {}, sys);
for (const s of ['done', 'bad', 'todo', 'block']) {
  const m = el('marker', { id: 'arr-' + s, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: s === 'done' ? '#5d6b82' : CV(s) }, m);
}
const nodeEls = {};
M.nodes.forEach(n => {
  const z = zoneOf(n);
  const g = el('g', { class: 'node' + (z && z.future ? ' future' : ''), tabindex: 0 }, gN);
  el('rect', { x: n.x - NW / 2, y: n.y - NH / 2, width: NW, height: NH, rx: 14, class: 'box' }, g);
  el('rect', { x: n.x - NW / 2 + 8, y: n.y - NH / 2 + 10, width: 5, height: NH - 20, rx: 2.5, fill: CV(n.s) }, g);
  const t = el('text', { x: n.x - NW / 2 + 24, y: n.y - 3, class: 'nt' }, g); t.textContent = n.t;
  const s = el('text', { x: n.x - NW / 2 + 24, y: n.y + 15, class: 'ns' }, g); s.textContent = ST[n.s];
  g.addEventListener('mouseenter', () => focusNode(n.id));
  g.addEventListener('mouseleave', () => focusNode(selected));
  g.addEventListener('click', e => { e.stopPropagation(); selected = n.id; focusNode(n.id); showNode(n); });
  nodeEls[n.id] = g;
});
let selected = null;
function focusNode(id) {
  sys.classList.toggle('focus', !!id);
  Object.values(nodeEls).forEach(g => g.classList.remove('on', 'sel'));
  edges.forEach(e => e.g.classList.remove('on'));
  if (!id) return;
  nodeEls[id].classList.add('on');
  if (id === selected) nodeEls[id].classList.add('sel');
  edges.forEach(e => { if (e.a === id || e.b === id) { e.g.classList.add('on'); nodeEls[e.a].classList.add('on'); nodeEls[e.b].classList.add('on'); } });
}

/* ═════════ панель ═════════ */
const panel = document.getElementById('panel'), pbody = document.getElementById('pbody');
const chip = s => `<span class="chip" style="background:${CV(s)}">${ST[s]}</span>`;
function stepsOf(tr) {
  return `<h3 style="color:${tr.color}">${esc(tr.title)}</h3><ol>${tr.steps.map(([nm, s]) =>
    `<li><i style="background:${CV(s)}"></i><span>${esc(nm)}</span></li>`).join('')}</ol>`;
}
function showStep(tr, name, s, note) {
  pbody.innerHTML = `<h2>${esc(name)}</h2>${chip(s)}${note ? `<p>${esc(note)}</p>` : ''}${stepsOf(tr)}`;
  panel.hidden = false;
}
function showNode(n) {
  const tracks = (n.track || []).map(id => M.tracks.find(t => t.id === id)).filter(Boolean);
  const links = M.links.filter(l => l[0] === n.id || l[1] === n.id)
    .map(([a, b, lb, s]) => `<li><i style="background:${CV(s)}"></i><span>${esc(byId[a].t)} → ${esc(byId[b].t)}${lb ? ' · ' + esc(lb) : ''}</span></li>`).join('');
  pbody.innerHTML = `<h2>${esc(n.t)}</h2>${chip(n.s)}<p>${esc(n.d)}</p>${n.f ? `<p><code>${esc(n.f)}</code></p>` : ''}
    <h3>Связи</h3><ol>${links}</ol>${tracks.map(stepsOf).join('')}`;
  panel.hidden = false;
}
document.getElementById('px').onclick = () => { panel.hidden = true; selected = null; focusNode(null); };

/* ═════════ двигать и масштабировать ═════════ */
function panZoom(svg, W, H) {
  let vb = { x: 0, y: 0, w: W, h: H };
  const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const fit = () => {
    const r = svg.getBoundingClientRect(), pad = 70;
    const k = Math.max(W / r.width, (H + pad) / r.height);
    vb = { w: r.width * k, h: r.height * k };
    vb.x = (W - vb.w) / 2; vb.y = -pad * k * 0.6 + (H + pad - vb.h) / 2;
    apply();
  };
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
    const px = vb.x + (e.clientX - r.left) / r.width * vb.w, py = vb.y + (e.clientY - r.top) / r.height * vb.h;
    vb.w *= k; vb.h *= k; vb.x = px - (px - vb.x) * k; vb.y = py - (py - vb.y) * k; apply();
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', e => { if (e.target.closest('.st, .node')) return; drag = { x: e.clientX, y: e.clientY }; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    vb.x -= (e.clientX - drag.x) / r.width * vb.w; vb.y -= (e.clientY - drag.y) / r.height * vb.h;
    drag = { x: e.clientX, y: e.clientY }; apply();
  });
  svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
  svg.addEventListener('click', () => { if (svg === sys) { selected = null; focusNode(null); } });
  return fit;
}
const fits = { metro: panZoom(metro, MW, MH), system: panZoom(sys, SW, SH) };

/* ═════════ вкладки ═════════ */
let tab = location.hash === '#system' ? 'system' : 'metro';
function show(t) {
  tab = t;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  metro.hidden = t !== 'metro'; sys.hidden = t !== 'system'; panel.hidden = true;
  fits[t](); history.replaceState(null, '', '#' + t);
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => show(b.dataset.tab));
document.getElementById('fit').onclick = () => fits[tab]();
addEventListener('resize', () => fits[tab]());
show(tab);
</script>
</body>
</html>
