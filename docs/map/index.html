<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Карта WED Secrets</title>
<style>
  /* Внутренний инструмент: тёмный холст, цвет несёт смысл статуса. */
  :root {
    --bg: #0d1016; --bg2: #151a23; --card: #1b212c; --card2: #222a37; --line: #2b3443; --ink: #fff;
    --done: #3ccf73; --work: #4ea1ff; --todo: #8b95a7; --bad: #ff5a5a; --block: #f2a93b;
    --high: #ff5a5a; --mid: #f2a93b; --low: #8b95a7;
    --top: 108px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13.5px/1.45 Onest, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  /* ── шапка */
  .top { position: fixed; z-index: 10; inset: 0 0 auto 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
  .row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  h1 { margin: 0; font-size: 17px; }
  .upd { font-size: 12px; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; }
  .st { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--bg2); font-size: 12px; }
  .st i, .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .search { margin-left: auto; min-width: 220px; flex: 0 1 320px; background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border: 0; background: transparent; padding: 9px 12px 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--ink); font-weight: 700; }
  .tabs b { font-weight: 400; font-size: 11px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--card2); }

  /* ── холсты */
  svg.map { position: fixed; left: 0; right: 0; bottom: 0; top: var(--top); width: 100%; height: calc(100% - var(--top)); cursor: grab; touch-action: none; }
  svg.map.drag { cursor: grabbing; }
  svg text { fill: var(--ink); font-family: inherit; user-select: none; }
  .tools { position: fixed; z-index: 9; right: 14px; bottom: 14px; display: flex; gap: 6px; }
  .tools button { border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .dim { opacity: .12; }

  /* метро */
  .seg-done { stroke-width: 7; stroke-linecap: round; fill: none; }
  .seg-todo { stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 2 7; opacity: .7; }
  .sta { cursor: pointer; }
  .sta:hover circle.r { stroke-width: 4.5; }
  .sta text { font-size: 11.5px; }
  .hit circle.r { stroke: #fff !important; stroke-width: 4.5; }
  .pulse { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(1); opacity: .8 } to { transform: scale(2.6); opacity: 0 } }

  /* система */
  .colh { font-size: 13px; font-weight: 700; }
  .edge path { fill: none; stroke-width: 1.6; }
  .edge.done path { stroke: #4f5d74; stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
  .edge.work path { stroke: var(--work); stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
  .edge.bad path { stroke: var(--bad); stroke-width: 2.4; stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
  .edge.todo path, .edge.block path { stroke: var(--todo); stroke-dasharray: 2 6; opacity: .55; }
  .edge text { font-size: 10px; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .node { cursor: pointer; }
  .node rect.b { fill: var(--card); stroke: var(--line); }
  .node:hover rect.b, .node.sel rect.b { stroke: #fff; }
  .node text { font-size: 12px; }
  svg.focus .node:not(.on), svg.focus .edge:not(.on) { opacity: .1; }

  /* ── списки */
  .page { padding: calc(var(--top) + 16px) 16px 60px; max-width: 1500px; margin: 0 auto; }
  .page h2 { font-size: 16px; margin: 22px 0 10px; }
  .page h2:first-child { margin-top: 0; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; border-left: 3px solid var(--c, var(--line)); min-width: 0; }
  .card h3 { margin: 0 0 4px; font-size: 13.5px; }
  .card p { margin: 4px 0 0; }
  .card code { font-size: 11.5px; background: var(--bg2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; background: var(--card2); }
  .chip.s { color: #0d1016; font-weight: 600; }
  .src { font-size: 11px; margin-top: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filters button, .filters select { border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--card2); }
  .bar span { display: block; }
  .trk { display: grid; grid-template-columns: 210px 1fr 70px; gap: 12px; align-items: center; padding: 6px 0; cursor: pointer; }
  .trk:hover { background: var(--bg2); }
  .trk .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .trk .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
  .stages { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .stage { background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .stage h3 { margin: 0; font-size: 15px; }
  .weeks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-items: start; }
  .wk li, .lst li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .wk ul, .lst { list-style: none; margin: 6px 0 0; padding: 0; }
  .tl { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 4px 0 8px 10px; }
  .tl li::before { content: ''; position: absolute; left: -22px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--work); }
  .tl b { font-variant-numeric: tabular-nums; margin-right: 8px; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t td, table.t th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .empty { padding: 20px 0; }

  /* ── панель деталей */
  .panel { position: fixed; z-index: 12; right: 12px; top: calc(var(--top) + 10px); width: 380px; max-height: calc(100% - var(--top) - 24px); overflow: auto;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .panel h2 { margin: 0 34px 6px 0; font-size: 16px; }
  .panel .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--card2); cursor: pointer; font-size: 17px; }
  .panel h3 { font-size: 13px; margin: 14px 0 4px; }
  .panel p { margin: 6px 0; }
  [hidden] { display: none !important; }
  @media (max-width: 720px) {
    :root { --top: 140px; }
    .search { margin-left: 0; flex: 1 1 100%; }
    .panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 60%; }
    .trk { grid-template-columns: 130px 1fr 52px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <h1>Карта WED Secrets</h1>
    <span class="upd" id="upd"></span>
    <div class="stats" id="stats"></div>
    <input class="search" id="q" type="search" placeholder="Поиск по всей карте: шаг, файл, решение…">
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<svg class="map" id="metro" hidden></svg>
<svg class="map" id="system" hidden></svg>
<div class="tools" id="tools" hidden><button id="fit">Вписать</button><button id="zin">+</button><button id="zout">−</button></div>
<main class="page" id="page"></main>
<aside class="panel" id="panel" hidden><button class="x" id="px" aria-label="Закрыть">×</button><div id="pb"></div></aside>

<script src="data.js"></script>
<script>
const M = window.MAP;
const NS = 'http://www.w3.org/2000/svg';
const ST = { done: 'сделано', work: 'в работе', todo: 'впереди', bad: 'сломано / долг', block: 'ждёт внешнего' };
const SEV = { high: 'важно', mid: 'средне', low: 'мелко' };
const C = s => `var(--${s})`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const chipS = s => `<span class="chip s" style="background:${C(s)}">${ST[s] || s}</span>`;
const steps = M.tracks.flatMap(t => t.steps.map(s => ({ ...s, track: t })));
const trackById = Object.fromEntries(M.tracks.map(t => [t.id, t]));
const count = (arr, s) => arr.filter(x => x.s === s).length;
const barHtml = arr => `<div class="bar">${Object.keys(ST).map(s => `<span style="flex:${count(arr, s)};background:${C(s)}"></span>`).join('')}</div>`;
let Q = '';
const match = (...xs) => !Q || xs.some(x => String(x ?? '').toLowerCase().includes(Q));

document.getElementById('upd').textContent = 'обновлено ' + M.updated;
document.getElementById('stats').innerHTML = Object.entries(ST).map(([k, v]) => `<span class="st"><i style="background:${C(k)}"></i>${v} ${count(steps, k)}</span>`).join('');

/* ═══ вкладки ═══ */
const TABS = [
  ['overview', 'Обзор'], ['metro', 'Путь', steps.length], ['system', 'Система', M.system.nodes.length],
  ['issues', 'Проблемы', M.issues.filter(i => i.s !== 'done').length], ['decisions', 'Решения', M.decisions.length],
  ['questions', 'Вопросы', M.questions.length], ['skills', 'Скиллы и рутина', M.skills.length + M.routines.length],
  ['weeks', 'Недели', M.weeks.length], ['docs', 'Документы', M.docs.length], ['recent', 'Хроника', M.recent.length],
];
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = TABS.map(([id, t, n]) => `<button role="tab" data-tab="${id}">${t}${n != null ? `<b>${n}</b>` : ''}</button>`).join('');
let tab = (location.hash.slice(1) || 'overview');
if (!TABS.some(t => t[0] === tab)) tab = 'overview';
tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); });

const page = document.getElementById('page'), metro = document.getElementById('metro'), sys = document.getElementById('system'), tools = document.getElementById('tools');
function show(t) {
  tab = t; history.replaceState(null, '', '#' + t);
  tabsEl.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  const svgTab = t === 'metro' || t === 'system';
  // у <svg> нет свойства .hidden (оно есть только у HTML-элементов) — только атрибутом
  metro.toggleAttribute('hidden', t !== 'metro'); sys.toggleAttribute('hidden', t !== 'system');
  tools.hidden = !svgTab; page.hidden = svgTab;
  document.getElementById('panel').hidden = true;
  render();
}
function render() {
  if (tab === 'metro') { drawMetro(); fits.metro(); }
  else if (tab === 'system') { drawSystem(); fits.system(); }
  else page.innerHTML = (VIEWS[tab] || VIEWS.overview)();
}
document.getElementById('q').addEventListener('input', e => { Q = e.target.value.trim().toLowerCase(); if (tab === 'metro') applyMetroSearch(); else if (tab === 'system') applySysSearch(); else render(); });

/* ═══ панель ═══ */
const panel = document.getElementById('panel'), pb = document.getElementById('pb');
document.getElementById('px').onclick = () => { panel.hidden = true; selected = null; focusNode(null); };
function openPanel(html) { pb.innerHTML = html; panel.hidden = false; }
function trackList(t) {
  return `<h3 style="color:${t.color}">${esc(t.title)} · ${count(t.steps, 'done')} из ${t.steps.length}</h3>${barHtml(t.steps)}
    <ul class="lst">${t.steps.map(s => `<li><span class="dot" style="background:${C(s.s)}"></span><span>${esc(s.t)}</span></li>`).join('')}</ul>`;
}
function stepPanel(s) {
  openPanel(`<h2>${esc(s.t)}</h2>${chipS(s.s)} ${s.date ? `<span class="chip">${esc(s.date)}</span>` : ''}
    ${s.note ? `<p>${esc(s.note)}</p>` : ''}${s.src ? `<p class="src">источник: ${esc(s.src)}</p>` : ''}${trackList(s.track)}`);
}

/* ═══ ОБЗОР ═══ */
const VIEWS = {};
VIEWS.overview = () => {
  const stages = M.stages.map(st => {
    const ss = steps.filter(s => s.track.stage === st.id);
    return `<div class="stage" style="border-top:3px solid ${C(st.status)}"><h3>Этап ${esc(st.id)}. ${esc(st.title)}</h3>
      <div class="meta"><span class="chip">${esc(st.period)}</span>${chipS(st.status)}<span class="chip">${count(ss, 'done')} из ${ss.length} шагов</span></div>
      ${barHtml(ss)}<p>${esc(st.goal)}</p>${st.notIncluded ? `<p class="src">не входит: ${esc(st.notIncluded)}</p>` : ''}</div>`;
  }).join('');
  const tracks = M.stages.map(st => `<h2>Этап ${esc(st.id)} — дорожки</h2>` + M.tracks.filter(t => t.stage === st.id).map(t =>
    `<div class="trk" data-track="${t.id}"><div class="nm"><span class="dot" style="background:${t.color}"></span><span>${esc(t.title)}</span></div>${barHtml(t.steps)}<div class="num">${count(t.steps, 'done')} / ${t.steps.length}</div></div>`).join('')).join('');
  const hot = M.issues.filter(i => i.sev === 'high' && i.s !== 'done');
  const blk = M.questions.filter(q => q.s === 'block' || q.blocks);
  return `<h2>Этапы</h2><div class="stages">${stages}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:8px">
      <div><h2>Важные проблемы · ${hot.length}</h2>${hot.map(issueCard).join('')}</div>
      <div><h2>Блокеры и вопросы · ${blk.length}</h2>${blk.slice(0, 12).map(questionCard).join('')}</div>
      <div><h2>Недавно</h2><ul class="tl">${M.recent.slice(0, 14).map(r => `<li><b>${esc(r.date)}</b>${esc(r.t)}</li>`).join('')}</ul></div>
    </div>${tracks}`;
};
page.addEventListener('click', e => {
  const t = e.target.closest('[data-track]'); if (t) { openPanel(trackList(trackById[t.dataset.track])); return; }
  const f = e.target.closest('[data-f]'); if (f) { const [k, v] = f.dataset.f.split(':'); FIL[k] = FIL[k] === v ? '' : v; render(); }
});
page.addEventListener('change', e => { if (e.target.dataset.fsel) { FIL[e.target.dataset.fsel] = e.target.value; render(); } });

/* ═══ ПРОБЛЕМЫ ═══ */
const FIL = { sev: '', s: '', area: '' };
function issueCard(i) {
  return `<div class="card" style="--c:${C(i.sev)}"><h3>${esc(i.t)}</h3>
    <div class="meta"><span class="chip s" style="background:${C(i.sev)}">${SEV[i.sev]}</span>${chipS(i.s)}<span class="chip">${esc(i.area)}</span></div>
    ${i.where ? `<p><code>${esc(i.where)}</code></p>` : ''}${i.fix ? `<p>→ ${esc(i.fix)}</p>` : ''}<p class="src">${esc(i.src)}</p></div>`;
}
VIEWS.issues = () => {
  const areas = [...new Set(M.issues.map(i => i.area))].sort();
  const list = M.issues.filter(i => (!FIL.sev || i.sev === FIL.sev) && (!FIL.s || i.s === FIL.s) && (!FIL.area || i.area === FIL.area) && match(i.t, i.where, i.fix, i.area, i.src))
    .sort((a, b) => (a.s === 'done') - (b.s === 'done') || 'hml'.indexOf(a.sev[0]) - 'hml'.indexOf(b.sev[0]));
  return `<div class="filters">${Object.entries(SEV).map(([k, v]) => `<button data-f="sev:${k}" aria-pressed="${FIL.sev === k}">${v} ${M.issues.filter(i => i.sev === k && i.s !== 'done').length}</button>`).join('')}
    ${['bad', 'todo', 'work', 'done'].map(k => `<button data-f="s:${k}" aria-pressed="${FIL.s === k}">${ST[k]} ${count(M.issues, k)}</button>`).join('')}
    <select data-fsel="area"><option value="">все области</option>${areas.map(a => `<option ${FIL.area === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></div>
    <div class="grid">${list.map(issueCard).join('') || '<p class="empty">Ничего не нашлось</p>'}</div>`;
};

/* ═══ РЕШЕНИЯ, ВОПРОСЫ ═══ */
VIEWS.decisions = () => {
  const list = M.decisions.filter(d => match(d.topic, d.decision, d.src));
  return `<table class="t"><tr><th>Тема</th><th>Решение</th><th>Дата</th><th>Источник</th></tr>${list.map(d =>
    `<tr><td><b>${esc(d.topic)}</b></td><td>${esc(d.decision)}</td><td class="num">${esc(d.date)}</td><td class="src">${esc(d.src)}</td></tr>`).join('')}</table>`;
};
function questionCard(q) {
  return `<div class="card" style="--c:${C(q.s)};margin-bottom:8px"><h3>${esc(q.q)}</h3><div class="meta">${chipS(q.s)}${q.who ? `<span class="chip">${esc(q.who)}</span>` : ''}</div>
    ${q.proposal ? `<p>Предложение: ${esc(q.proposal)}</p>` : ''}${q.blocks ? `<p class="src">блокирует: ${esc(q.blocks)}</p>` : ''}</div>`;
}
VIEWS.questions = () => {
  const by = {}; M.questions.filter(q => match(q.q, q.proposal, q.blocks, q.who)).forEach(q => (by[q.who || '—'] ??= []).push(q));
  return Object.entries(by).map(([w, qs]) => `<h2>${esc(w)} · ${qs.length}</h2><div class="grid">${qs.map(questionCard).join('')}</div>`).join('') || '<p class="empty">Ничего не нашлось</p>';
};

/* ═══ СКИЛЛЫ И РУТИНА ═══ */
VIEWS.skills = () => `<h2>Скиллы — заготовки поведения Claude под задачу</h2><div class="grid">${M.skills.filter(s => match(s.name, s.what, s.triggers)).map(s =>
  `<div class="card" style="--c:${C(s.s)}"><h3>${esc(s.name)}</h3><div class="meta">${chipS(s.s)}</div><p>${esc(s.what)}</p>${s.triggers ? `<p class="src">когда: ${esc(s.triggers)}</p>` : ''}<p class="src">${esc(s.src)}</p></div>`).join('')}</div>
  <h2>Рутина — что прогонять и когда</h2><div class="grid">${M.routines.filter(r => match(r.t, r.when, r.how)).map(r =>
  `<div class="card" style="--c:${C(r.s)}"><h3>${esc(r.t)}</h3><div class="meta">${chipS(r.s)}<span class="chip">${esc(r.when)}</span></div><p><code>${esc(r.how)}</code></p></div>`).join('')}</div>`;

/* ═══ НЕДЕЛИ, ДОКУМЕНТЫ, ХРОНИКА ═══ */
VIEWS.weeks = () => `<div class="weeks">${M.weeks.map(w => `<div class="card"><h3>${esc(w.title)}</h3>${barHtml(w.items)}<ul>${w.items.filter(i => match(i.t)).map(i =>
  `<li class="wk"><span class="dot" style="background:${C(i.s)}"></span><span>${esc(i.t)}</span></li>`).join('')}</ul></div>`).join('')}</div>`;
VIEWS.docs = () => `<table class="t"><tr><th>Файл</th><th class="num">Строк</th><th>Роль</th><th>Судьба</th></tr>${M.docs.filter(d => match(d.file, d.role, d.fate)).map(d =>
  `<tr><td><code>${esc(d.file)}</code></td><td class="num">${esc(d.lines)}</td><td>${esc(d.role)}</td><td>${esc(d.fate)}</td></tr>`).join('')}</table>`;
VIEWS.recent = () => `<ul class="tl">${M.recent.filter(r => match(r.t, r.date)).map(r => `<li><b>${esc(r.date)}</b>${esc(r.t)}</li>`).join('')}</ul>`;

/* ═══ ПУТЬ: схема метро ═══ */
const S = 46, X0 = 300, ROW = 150, HEAD = 64;
let metroDrawn = false, MW = 0, MH = 0;
const staEls = [];
function drawMetro() {
  if (metroDrawn) return applyMetroSearch(); metroDrawn = true;
  const maxN = Math.max(...M.tracks.map(t => t.steps.length));
  MW = X0 + maxN * S + 80;
  let y = 30;
  for (const st of M.stages) {
    const tracks = M.tracks.filter(t => t.stage === st.id);
    if (!tracks.length) continue;
    el('rect', { x: 0, y, width: MW, height: HEAD + tracks.length * ROW, rx: 18, fill: '#11151d' }, metro);
    const h = el('text', { x: 20, y: y + 30, 'font-size': 18, 'font-weight': 700 }, metro); h.textContent = `Этап ${st.id}. ${st.title}`;
    const p = el('text', { x: 20, y: y + 50, 'font-size': 12 }, metro); p.textContent = `${st.period} · ${ST[st.status] || st.status}`;
    y += HEAD;
    for (const tr of tracks) {
      const ly = y + ROW - 40, n = tr.steps.length;
      const xs = tr.steps.map((_, k) => X0 + 20 + k * S);
      let reached = -1; tr.steps.forEach((s, k) => { if (s.s === 'done' || s.s === 'work') reached = k; });
      el('path', { d: `M${xs[0]},${ly} H${xs[n - 1] + 24}`, class: 'seg-todo', stroke: tr.color }, metro);
      if (reached > 0) el('path', { d: `M${xs[0]},${ly} H${xs[reached]}`, class: 'seg-done', stroke: tr.color }, metro);
      // название линии и прогресс
      const g = el('g', { class: 'sta' }, metro);
      el('rect', { x: 16, y: ly - 26, width: 260, height: 52, rx: 26, fill: tr.color }, g);
      const t1 = el('text', { x: 34, y: ly - 4, 'font-size': 14, 'font-weight': 700 }, g); t1.textContent = tr.title.length > 26 ? tr.title.slice(0, 25) + '…' : tr.title;
      const t2 = el('text', { x: 34, y: ly + 14, 'font-size': 11.5 }, g); t2.textContent = `${count(tr.steps, 'done')} из ${n}${tr.owner ? ' · ' + tr.owner : ''}`;
      g.addEventListener('click', e => { e.stopPropagation(); openPanel(trackList(tr)); });
      tr.steps.forEach((s, k) => {
        const x = xs[k], gs = el('g', { class: 'sta' }, metro);
        if (s.s === 'work') el('circle', { cx: x, cy: ly, r: 9, fill: tr.color, class: 'pulse' }, gs);
        const fill = s.s === 'done' ? tr.color : s.s === 'bad' ? C('bad') : s.s === 'block' ? C('block') : s.s === 'work' ? '#fff' : '#0d1016';
        const ring = s.s === 'bad' ? C('bad') : s.s === 'block' ? C('block') : tr.color;
        el('circle', { cx: x, cy: ly, r: 8, fill, stroke: ring, 'stroke-width': 3, class: 'r' }, gs);
        const mk = s.s === 'bad' ? '!' : s.s === 'block' ? '…' : '';
        if (mk) { const m = el('text', { x, y: ly + 3.5, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700 }, gs); m.textContent = mk; }
        const lb = el('text', { x: x + 4, y: ly - 14, transform: `rotate(-38 ${x + 4} ${ly - 14})` }, gs);
        lb.textContent = s.t.length > 40 ? s.t.slice(0, 39) + '…' : s.t;
        gs.addEventListener('click', e => { e.stopPropagation(); stepPanel({ ...s, track: tr }); });
        staEls.push({ g: gs, s, tr });
      });
      y += ROW;
    }
    y += 24;
  }
  MH = y;
  applyMetroSearch();
}
function applyMetroSearch() { staEls.forEach(({ g, s, tr }) => { const hit = Q && match(s.t, s.note, s.src, tr.title); g.classList.toggle('dim', !!Q && !hit); g.classList.toggle('hit', !!hit); }); }

/* ═══ СИСТЕМА: граф колонками ═══ */
const CW = 250, NW = 224, NH = 32, GAP = 8, SY = 70;
let sysDrawn = false, SW = 0, SH = 0, selected = null;
const nodeEls = {}, edgeEls = [];
function drawSystem() {
  if (sysDrawn) return applySysSearch(); sysDrawn = true;
  const { groups, nodes, links } = M.system;
  const col = Object.fromEntries(groups.map((g, i) => [g.id, i]));
  const byG = groups.map(g => nodes.filter(n => n.group === g.id));
  const pos = {};
  const place = () => byG.forEach((list, ci) => list.forEach((n, k) => (pos[n.id] = { x: 30 + ci * CW, y: SY + k * (NH + GAP), c: ci })));
  place();
  // порядок внутри колонки — по среднему положению соседей (меньше перекрещиваний)
  const nb = {}; links.forEach(l => { (nb[l.a] ??= []).push(l.b); (nb[l.b] ??= []).push(l.a); });
  for (let it = 0; it < 6; it++) {
    byG.forEach(list => list.sort((a, b) => {
      const m = n => { const ys = (nb[n.id] || []).map(id => pos[id]?.y).filter(v => v != null); return ys.length ? ys.reduce((x, y) => x + y) / ys.length : pos[n.id].y; };
      return m(a) - m(b);
    }));
    place();
  }
  SW = 30 + groups.length * CW; SH = SY + Math.max(...byG.map(l => l.length)) * (NH + GAP) + 40;
  groups.forEach((g, ci) => {
    el('rect', { x: 22 + ci * CW, y: 20, width: CW - 14, height: SH - 30, rx: 14, fill: '#11151d' }, sys);
    const t = el('text', { x: 34 + ci * CW, y: 48, class: 'colh' }, sys); t.textContent = `${g.title} · ${byG[ci].length}`;
  });
  const gE = el('g', {}, sys), gN = el('g', {}, sys);
  links.forEach(l => {
    const A = pos[l.a], B = pos[l.b]; if (!A || !B) return;
    let d;
    const ay = A.y + NH / 2, by = B.y + NH / 2;
    if (A.c === B.c) { const x = A.x + NW; d = `M${x},${ay} C${x + 40},${ay} ${x + 40},${by} ${x},${by}`; }
    else {
      const fwd = B.c > A.c, x1 = fwd ? A.x + NW : A.x, x2 = fwd ? B.x : B.x + NW, k = Math.max(50, Math.abs(x2 - x1) * 0.45) * (fwd ? 1 : -1);
      d = `M${x1},${ay} C${x1 + k},${ay} ${x2 - k},${by} ${x2},${by}`;
    }
    const g = el('g', { class: 'edge ' + l.s }, gE);
    const path = el('path', { d }, g);
    const tt = el('title', {}, path); tt.textContent = `${l.t || ''}`;
    edgeEls.push({ a: l.a, b: l.b, g });
  });
  nodes.forEach(n => {
    const p = pos[n.id], g = el('g', { class: 'node' }, gN);
    el('rect', { x: p.x, y: p.y, width: NW, height: NH, rx: 9, class: 'b' }, g);
    el('rect', { x: p.x + 6, y: p.y + 8, width: 4, height: NH - 16, rx: 2, fill: C(n.s) }, g);
    const t = el('text', { x: p.x + 18, y: p.y + NH / 2 + 4 }, g); t.textContent = n.t.length > 30 ? n.t.slice(0, 29) + '…' : n.t;
    g.addEventListener('mouseenter', () => focusNode(n.id));
    g.addEventListener('mouseleave', () => focusNode(selected));
    g.addEventListener('click', e => { e.stopPropagation(); selected = n.id; focusNode(n.id); nodePanel(n); });
    nodeEls[n.id] = { g, n };
  });
  applySysSearch();
}
function focusNode(id) {
  sys.classList.toggle('focus', !!id);
  Object.values(nodeEls).forEach(({ g }) => g.classList.remove('on', 'sel'));
  edgeEls.forEach(e => e.g.classList.remove('on'));
  if (!id || !nodeEls[id]) return;
  nodeEls[id].g.classList.add('on', ...(id === selected ? ['sel'] : []));
  edgeEls.forEach(e => { if (e.a === id || e.b === id) { e.g.classList.add('on'); nodeEls[e.a]?.g.classList.add('on'); nodeEls[e.b]?.g.classList.add('on'); } });
}
function applySysSearch() { Object.values(nodeEls).forEach(({ g, n }) => g.classList.toggle('dim', !!Q && !match(n.t, n.d, n.f))); }
function nodePanel(n) {
  const nm = id => esc(nodeEls[id]?.n.t || id);
  const ls = M.system.links.filter(l => l.a === n.id || l.b === n.id);
  openPanel(`<h2>${esc(n.t)}</h2>${chipS(n.s)} <span class="chip">${esc(M.system.groups.find(g => g.id === n.group)?.title)}</span>
    <p>${esc(n.d)}</p>${n.f ? `<p><code>${esc(n.f)}</code></p>` : ''}
    <h3>Связи · ${ls.length}</h3><ul class="lst">${ls.map(l => `<li><span class="dot" style="background:${C(l.s)}"></span><span>${nm(l.a)} → ${nm(l.b)}${l.t ? ' · ' + esc(l.t) : ''}</span></li>`).join('')}</ul>`);
}
sys.addEventListener('click', () => { selected = null; focusNode(null); });

/* ═══ двигать и масштабировать ═══ */
function panZoom(svg, size) {
  let vb = { x: 0, y: 0, w: 100, h: 100 };
  const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const zoom = (k, cx, cy) => { const r = svg.getBoundingClientRect(); const px = vb.x + (cx - r.left) / r.width * vb.w, py = vb.y + (cy - r.top) / r.height * vb.h; vb.w *= k; vb.h *= k; vb.x = px - (px - vb.x) * k; vb.y = py - (py - vb.y) * k; apply(); };
  const fit = () => { const [W, H] = size(); const r = svg.getBoundingClientRect(); if (!r.width) return; const k = Math.max(W / r.width, H / r.height, 0.6 * W / r.width); vb = { w: r.width * k, h: r.height * k, x: 0, y: 0 }; if (W / r.width < H / r.height) vb.x = (W - vb.w) / 2; apply(); };
  // широкая схема: стартуем с читаемого масштаба у левого края, а не мелким целиком
  const start = () => { const [W, H] = size(); const r = svg.getBoundingClientRect(); if (!r.width) return; const k = Math.min(Math.max(W / r.width, H / r.height), 1.6); vb = { x: -10, y: 0, w: r.width * k, h: r.height * k }; apply(); };
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
  let drag = null, moved = false;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; moved = false; });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return;
    if (!moved) { moved = true; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); }
    const r = svg.getBoundingClientRect(); vb.x -= (e.clientX - drag.x) / r.width * vb.w; vb.y -= (e.clientY - drag.y) / r.height * vb.h; drag = { x: e.clientX, y: e.clientY }; apply();
  });
  svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
  svg.addEventListener('click', e => { if (moved) e.stopPropagation(); }, true);
  return { fit, start, zoom: k => { const r = svg.getBoundingClientRect(); zoom(k, r.left + r.width / 2, r.top + r.height / 2); } };
}
const pz = { metro: panZoom(metro, () => [MW, MH]), system: panZoom(sys, () => [SW, SH]) };
const fits = { metro: () => pz.metro.start(), system: () => pz.system.start() };
document.getElementById('fit').onclick = () => pz[tab]?.fit();
document.getElementById('zin').onclick = () => pz[tab]?.zoom(1 / 1.3);
document.getElementById('zout').onclick = () => pz[tab]?.zoom(1.3);

addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t !== tab && TABS.some(x => x[0] === t)) show(t); });
show(tab);
</script>
